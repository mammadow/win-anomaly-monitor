[package]
name = "resmon"
version = "4.0.0"
edition = "2021"
authors = ["Elnur Mammadov"]
description = "Lightweight Windows 11 resource & anomaly monitor with adaptive kNN detection, deep process/service attribution, HighQoS UI responsiveness probing, and AI-assisted forensic diagnostics."
license = "MIT"
repository = "https://github.com/mammadow/win-anomaly-monitor"
default-run = "resmon"

[[bin]]
name = "resmon"
path = "src/main.rs"

[[bin]]
name = "resmonw"
path = "src/bin/resmonw.rs"

[lib]
name = "resmon"
path = "src/lib.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
rayon = "1.10"
ureq = { version = "2.10", features = ["json"] }
libloading = "0.8"
ratatui = "0.29"
crossterm = "0.28"
rand = "0.8"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
