name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build and publish (e.g. v4.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Windows Release (windows-latest)
    runs-on: windows-latest
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Resolve and validate release tag against Cargo.toml
        id: meta
        shell: pwsh
        run: |
          $tag = if ("${{ inputs.tag }}") { "${{ inputs.tag }}" } else { "${{ github.ref_name }}" }
          if ($tag -notmatch '^v\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') {
            throw "Release tag '$tag' must follow semantic version format vX.Y.Z"
          }
          $cargoToml = Get-Content Cargo.toml -Raw
          if ($cargoToml -match '(?m)^version\s*=\s*"([^"]+)"') {
            $crateTag = "v$($Matches[1])"
            if ($tag -ne $crateTag) {
              throw "Tag '$tag' does not match Cargo.toml version '$crateTag'"
            }
          } else {
            throw "Failed to read package version from Cargo.toml"
          }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Verify formatting and Clippy lints
        run: |
          cargo fmt --check
          cargo clippy --all-targets --locked -- -D warnings

      - name: Run Rust test suite
        run: cargo test --all-targets --locked -- --nocapture

      - name: Build release binaries
        run: cargo build --release --locked

      - name: Package Windows release archive and SHA-256 checksums
        shell: pwsh
        run: |
          $tag = "${{ steps.meta.outputs.tag }}"
          $bundleName = "resmon-$tag-windows-x86_64"
          $stageDir = Join-Path "dist" $bundleName
          New-Item -ItemType Directory -Force -Path $stageDir | Out-Null

          Copy-Item `
            -Path "target\release\resmon.exe", "target\release\resmonw.exe", "config.example.toml", "README.md", "LICENSE" `
            -Destination $stageDir

          $zipPath = Join-Path "dist" "$bundleName.zip"
          Compress-Archive -Path (Join-Path $stageDir "*") -DestinationPath $zipPath -Force

          Copy-Item -Path "target\release\resmon.exe", "target\release\resmonw.exe" -Destination "dist\" -Force

          $distAbs = (Resolve-Path "dist").Path
          $assetNames = @("$bundleName.zip", "resmon.exe", "resmonw.exe")
          $sumLines = foreach ($name in $assetNames) {
            $hash = (Get-FileHash -LiteralPath (Join-Path $distAbs $name) -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $name"
          }
          $utf8NoBom = [System.Text.UTF8Encoding]::new($false)
          [System.IO.File]::WriteAllText((Join-Path $distAbs "SHA256SUMS.txt"), (($sumLines -join "`n") + "`n"), $utf8NoBom)

      - name: Create or update GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ steps.meta.outputs.tag }}"
          $title = "$tag — Pure Rust Windows Anomaly & Forensic Monitor"
          $assets = @(
            "dist\resmon-$tag-windows-x86_64.zip",
            "dist\resmon.exe",
            "dist\resmonw.exe",
            "dist\SHA256SUMS.txt"
          )

          $oldEap = $ErrorActionPreference
          $ErrorActionPreference = 'Continue'
          $tagNotes = (git tag -l --format="%(contents)" $tag 2>$null | Out-String).Trim()
          gh release view $tag *> $null
          $exists = ($LASTEXITCODE -eq 0)
          $ErrorActionPreference = $oldEap

          if ($exists) {
            gh release upload $tag @assets --clobber
            if ($LASTEXITCODE -ne 0) { throw "gh release upload failed ($LASTEXITCODE)" }
            if ($tagNotes) {
              gh release edit $tag --title $title --notes $tagNotes --latest
            } else {
              gh release edit $tag --title $title --latest
            }
            if ($LASTEXITCODE -ne 0) { throw "gh release edit failed ($LASTEXITCODE)" }
          } else {
            if ($tagNotes) {
              gh release create $tag @assets --verify-tag --title $title --notes $tagNotes --generate-notes --latest
            } else {
              gh release create $tag @assets --verify-tag --title $title --generate-notes --latest
            }
            if ($LASTEXITCODE -ne 0) { throw "gh release create failed ($LASTEXITCODE)" }
          }
