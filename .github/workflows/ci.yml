name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  rust-test:
    name: Rust v4 Engine (windows-latest)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --locked

      - name: Run Rust test suite
        run: cargo test --all-targets -- --nocapture

  legacy-python-test:
    name: Legacy Python v3 (${{ matrix.python-version }} on windows-latest)
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: legacy/requirements.txt

      - name: Install dependencies
        working-directory: legacy
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-github-actions-annotate-failures

      - name: Run legacy test suite
        working-directory: legacy
        env:
          PYTHONPATH: .
        run: |
          python -m pytest tests -v -ra
